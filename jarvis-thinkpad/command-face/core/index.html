<!DOCTYPE html>
<!--
The Core (Orbitals): a face for ai-visualizer (github.com/jaredrhod/ai-visualizer,
AGPL-3.0-or-later), written for the jarvis-thinkpad build. Same license as the
visualizer it plugs into.

Two layers on one screen:
  outer  three tilted particle orbits = the voice and the personality. They drift
         at idle, whirl while thinking, tint amber and follow the mic while
         listening, and their particles swell with the waveform while speaking.
  core   the agent team, zoomed out: Command in the middle, the leads around it,
         the workers as points. Whoever is working right now glows green.
Zoom in (Z, click the core, or Flint's own signal) and the orbits open past the
edges of the screen while the core grows into the org chart: Command, leads,
workers, each worker's Job, and their tools. The data tiles stay where they are.

Data (shared with the Command face, in faces/command/):
  team.json   the roster                       bin/team-sync.py
  live.json   who works, the feed, the words   bin/team-live.py (hooks) + bin/talk-tap.py
  view.json   {"view":"team"|"voice","focus":"<dept id>","ts":<epoch>}  bin/core-view.sh
  usage       AV.rateLimits, published by backtalk when "show_usage": true

Keys: Z / Enter zoom in and out · Esc back to the voice · F fullscreen · R reload the roster
in the team view: wheel zoom, drag pan, click a lead to focus it, double-click to reset.
?view=team opens zoomed in · ?demo=1 performs with sample data · ?shot=<state> screenshot harness.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:,">
<title>The Core</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#0b0a09;overflow:hidden}
  body{font-family:"Inter","Helvetica Neue",Helvetica,Arial,"Ubuntu","DejaVu Sans",sans-serif;color:#f6f1ec}
  canvas#stage{position:fixed;inset:0;width:100vw;height:100vh;display:block;cursor:default}
  #tip{position:fixed;pointer-events:none;display:none;max-width:320px;padding:9px 11px;z-index:20;
       background:rgba(14,11,9,.94);border:1px solid rgba(255,235,220,.14);border-radius:8px;font-size:11px;line-height:1.65;color:#d8cfc6}
  #tip b{color:#f6f1ec;font-weight:600}
  #tip .k{color:#8d8178}
  #tip .on{color:#60de98}
  #detail{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);max-width:520px;display:none;padding:12px 16px;z-index:20;
       background:rgba(14,11,9,.94);border:1px solid rgba(255,235,220,.14);border-radius:10px;font-size:12px;line-height:1.75;color:#d8cfc6;
       box-shadow:0 20px 50px rgba(0,0,0,.5)}
  #detail b{color:#f6f1ec;font-weight:600}
  #detail .k{color:#8d8178}
  #detail .on{color:#60de98}
  #detail code{font-family:"SF Mono",Menlo,Consolas,"Ubuntu Mono","DejaVu Sans Mono",monospace;font-size:11px;color:#ffbe6e}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="tip"></div>
<div id="detail"></div>
<script src="../../core.js"></script>
<script>
"use strict";
const Q = new URLSearchParams(location.search);
AV.init({ mic: true });
const DATA = "../command/";                        // shared with the Command face
const $ = id => document.getElementById(id);
const cv = $("stage"), g = cv.getContext("2d");
const U = AV.util;
const SANS = '"Inter","Helvetica Neue",Helvetica,Arial,"Ubuntu","DejaVu Sans",sans-serif';
const MONO = '"SF Mono",Menlo,Consolas,"Ubuntu Mono","DejaVu Sans Mono",monospace';
const SERIF = 'Georgia,"Times New Roman","DejaVu Serif",serif';
const P = { bg: "#0b0a09", tile: [255, 250, 245], text: [246, 241, 236], muted: [160, 150, 140], dim: [98, 90, 84], line: [255, 245, 235],
            accent: [255, 122, 92], green: [96, 222, 152], amber: [255, 190, 110], blue: [130, 170, 255], cyan: [120, 210, 255], white: [255, 255, 255] };
const rgba = U.rgba;
let W = 0, H = 0, DPR = 1, S = 1, M = 0, CX = 0, CY = 0;
let grainC = null, STARS = [];
function resize() {

const px = v => v * S;

/* ---------------------------------------------------------------- drawing */
const glow = {};
function sprite(c) { const k = c.join(","); return glow[k] || (glow[k] = U.makeGlow(c, 64)); }
function dot(x, y, r, c, a = 1, halo = 2.4) {

}
function text(s, x, y, size, c, o = {}) {
  const { a = 1, align = "left", ls = 0, font = SANS, weight = "", base = "middle", style = "" } = o;
  g.font = `${style} ${weight} ${Math.max(8, size)}px ${font}`.trim(); g.textBaseline = base; g.fillStyle = rgba(c, a);
  if (ls) {

    let x0 = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
    g.textAlign = "left"; for (const ch of chars) { g.fillText(ch, x0, y); x0 += g.measureText(ch).width + ls; } return w;
  }
  g.textAlign = align; g.fillText(s, x, y); return g.measureText(s).width;
}
const label = (s, x, y, o = {}) => text(String(s).toUpperCase(), x, y, o.size || px(9), o.c || P.dim, { ls: px(2.6), font: MONO, align: o.align || "left", a: o.a ?? 1 });
function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function tile(x, y, w, h, o = {}) {
  const r = px(16);
  g.save(); g.shadowColor = "rgba(0,0,0,.45)"; g.shadowBlur = px(30); g.shadowOffsetY = px(10); rr(x, y, w, h, r); g.fillStyle = rgba(P.tile, .035); g.fill(); g.restore();
  rr(x, y, w, h, r); const gr = g.createLinearGradient(x, y, x, y + h); gr.addColorStop(0, rgba(P.tile, .035)); gr.addColorStop(1, rgba(P.tile, 0)); g.fillStyle = gr; g.fill();
  g.strokeStyle = rgba(P.line, .09); g.lineWidth = 1; g.stroke();
  const hl = g.createLinearGradient(x, y, x + w, y); hl.addColorStop(0, rgba(P.line, 0)); hl.addColorStop(.5, rgba(P.line, .28)); hl.addColorStop(1, rgba(P.line, 0));
  g.strokeStyle = hl; g.beginPath(); g.moveTo(x + r, y + .5); g.lineTo(x + w - r, y + .5); g.stroke();
  if (o.title) label(o.title, x + px(22), y + px(26));
}
function spark(x, y, w, h, c, pts) {
  if (!pts || pts.length < 2) { g.strokeStyle = rgba(c, .35); g.lineWidth = 1; g.beginPath(); g.moveTo(x, y + h * .6); g.lineTo(x + w, y + h * .6); g.stroke(); return; }
  let lo = Math.min(...pts), hi = Math.max(...pts); if (hi - lo < 1e-6) { lo -= 1; hi += 1; }
  const P2 = pts.map((v, i) => [x + i / (pts.length - 1) * w, y + h - (.12 + .76 * (v - lo) / (hi - lo)) * h]);
  const gr = g.createLinearGradient(0, y, 0, y + h); gr.addColorStop(0, rgba(c, .25)); gr.addColorStop(1, rgba(c, 0));
  g.fillStyle = gr; g.beginPath(); g.moveTo(P2[0][0], y + h); P2.forEach(p => g.lineTo(p[0], p[1])); g.lineTo(P2[P2.length - 1][0], y + h); g.closePath(); g.fill();
  g.strokeStyle = rgba(c, .95); g.lineWidth = 1.5; g.beginPath(); P2.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke();
  const e = P2[P2.length - 1]; dot(e[0], e[1], 2.5, c, 1, 2);
}
function kpi(x, y, w, h, o) {
  tile(x, y, w, h); const c = o.color || P.text;
  text(o.value, x + px(22), y + h * .46, px(o.size || 28), c, { weight: "700" });
  label(o.label, x + px(22), y + h - px(22));
  if (o.sub) label(o.sub, x + w - px(22), y + h - px(22), { align: "right", c: o.subc || P.dim });
  if (o.spark) spark(x + w * .52, y + h * .3, w * .48 - px(22), h * .36, c, o.spark);
}
function wrap(str, maxW) { const lines = []; let cur = ""; for (const w of String(str).split(/\s+/)) { const t = cur ? cur + " " + w : w; if (cur && g.measureText(t).width > maxW) { lines.push(cur); cur = w; } else cur = t; } if (cur) lines.push(cur); return lines; }
function blob(x, y, r, c, a) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, rgba(c, a)); gr.addColorStop(1, rgba(c, 0)); g.fillStyle = gr; g.fillRect(0, 0, W, H); }
function grain() {
  if (!grainC) { const s = 3, w = Math.ceil(W / s), h = Math.ceil(H / s); grainC = document.createElement("canvas"); grainC.width = w; grainC.height = h; const x = grainC.getContext("2d"), id = x.createImageData(w, h); for (let i = 0; i < id.data.length; i += 4) { const v = 128 + (Math.random() - .5) * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } x.putImageData(id, 0, 0); }
  g.globalAlpha = .04; g.globalCompositeOperation = "overlay"; g.drawImage(grainC, 0, 0, W, H); g.globalCompositeOperation = "source-over"; g.globalAlpha = 1;
}
const fmtTime = ts => new Date(ts * 1000).toLocaleTimeString([], { hour12: false });
const clip = (s, n) => { s = String(s || "").replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n - 1) + "…" : s; };

/* ------------------------------------------------------------------ team */
const R1 = 1, RJ = 1.62, R2 = 2.25, R3 = 3.15;   // the org chart, world units (same as the Command face)
const SAMPLE_TEAM = { operator: "Valentin", command: "flint", departments: [
  { id: "comms", name: "Comms", lead: "comms-lead", workers: [{ name: "comms-inbox-triage", job: "Triage the inbox", tools: ["gmail", "vault"] }, { name: "comms-reply-drafter", job: "Draft replies", tools: ["vault"] }, { name: "comms-crm-pipeline", job: "Pipeline", tools: ["sheets", "vault"] }] },
  { id: "finance", name: "Finance", lead: "finance-lead", workers: [{ name: "finance-ledger", job: "Keep the ledger", tools: ["vault", "csv"] }, { name: "finance-invoices", job: "Chase invoices", tools: ["gmail", "vault"] }, { name: "finance-weekly-review", job: "Weekly review", tools: ["vault"] }] },
  { id: "content", name: "Content", lead: "content-lead", workers: [{ name: "content-writer", job: "Write", tools: ["marketing", "vault"] }, { name: "content-scheduler", job: "Calendar", tools: ["calendar", "vault"] }, { name: "content-lead-magnets", job: "Lead magnets", tools: ["browser", "vault"] }] },
  { id: "knowledge", name: "Knowledge", lead: "knowledge-lead", workers: [{ name: "knowledge-librarian", job: "Vault hygiene", tools: ["vault", "obsidian"] }, { name: "knowledge-researcher", job: "Research", tools: ["web", "vault"] }] },
  { id: "automations", name: "Automations", lead: "automations-lead", workers: [{ name: "automations-home", job: "Run the house", tools: ["home-assistant"] }, { name: "automations-machine", job: "ThinkPad", tools: ["bash", "docker", "systemd"] }, { name: "automations-timers", job: "Timers", tools: ["systemd"] }] } ] };
const SAMPLE_LIVE = { active: { "comms-inbox-triage": 1, "finance-ledger": 1 }, command: "thinking", turns: 142,
  you: { text: "Get the inbox sorted and the ledger, then tell me what finance looks like.", ts: 0 },
  said: { text: "Comms is on the inbox, Finance is reading September. Two things need your call, sir.", ts: 0 },
  feed: [["finance-ledger", "reading Finance/exports/09.csv · 212 rows"], ["comms-inbox-triage", "14 threads · 3 need a reply"], ["Flint", "dispatched comms-lead and finance-lead"], ["You", "“get the inbox sorted and the ledger”"], ["automations-machine", "vault backup pushed · disk 61%"]].map(([w, s], i) => ({ ts: Date.now() / 1000 - i * 48 - 20, who: w, what: s })) };
let team = null, roster = "loading", live = { active: {}, command: "idle", feed: [] }, nodes = [], edges = [];
function layout() {
  nodes = []; edges = [];
  const depts = (team.departments || []).filter(d => d && d.name);
  const cmd = { id: "cmd", kind: "cmd", name: team.command || "flint", label: (team.command || "FLINT").toUpperCase(), x: 0, y: 0, th: 0, desc: "Command" };
  nodes.push(cmd);
  const n = Math.max(1, depts.length), sector = Math.PI * 2 / n;
  depts.forEach((d, i) => {
    const th = -Math.PI / 2 + i * sector;
    const lead = { id: "lead:" + d.id, kind: "lead", name: d.lead || d.id + "-lead", label: d.name, x: Math.cos(th) * R1, y: Math.sin(th) * R1, th, dept: d.id, desc: d.folder ? "folder: " + d.folder : "" };
    nodes.push(lead); edges.push({ a: cmd, b: lead, kind: "pillar" });
    const workers = d.workers || [], m = workers.length, spread = sector * 0.78, tools = [];
    workers.forEach((w, j) => {
      const a = th + (m === 1 ? 0 : (j - (m - 1) / 2) * (spread / Math.max(1, m - 1)));
      const wn = { id: "w:" + w.name, kind: "worker", name: w.name, label: w.name, x: Math.cos(a) * R2, y: Math.sin(a) * R2, th: a, dept: d.id, job: w.job || "", tools: w.tools || [], desc: w.description || "" };
      nodes.push(wn);
      if (w.job) { const jn = { id: "j:" + w.name, kind: "job", name: w.job, label: w.job, x: Math.cos(a) * RJ, y: Math.sin(a) * RJ, th: a, dept: d.id, worker: wn }; nodes.push(jn); edges.push({ a: lead, b: jn, kind: "sop" }); edges.push({ a: jn, b: wn, kind: "does" }); }
      else edges.push({ a: lead, b: wn, kind: "member" });
      for (const t of wn.tools) { let e = tools.find(x => x.slug === t); if (!e) tools.push(e = { slug: t, users: [] }); e.users.push(wn); }
    });
    const k = tools.length, tspread = sector * 0.86;
    tools.forEach((t, j) => {
      const a = th + (k === 1 ? 0 : (j - (k - 1) / 2) * (tspread / Math.max(1, k - 1)));
      const tn = { id: "t:" + d.id + ":" + t.slug, kind: "tool", name: t.slug, label: t.slug, x: Math.cos(a) * R3, y: Math.sin(a) * R3, th: a, dept: d.id, desc: t.users.length + " user" + (t.users.length === 1 ? "" : "s") };
      nodes.push(tn); for (const u of t.users) edges.push({ a: u, b: tn, kind: "uses" });
    });
  });
}
async function loadTeam() {
  try { const r = await fetch(DATA + "team.json", { cache: "no-store" }); if (!r.ok) throw 0; team = await r.json(); roster = "connected"; }
  catch (e) { team = SAMPLE_TEAM; roster = AV.demo ? "demo" : "sample roster"; }
  layout();
}
async function loadLive() {
  let l = null;
  try { const r = await fetch(DATA + "live.json", { cache: "no-store" }); if (r.ok) l = await r.json(); } catch (e) {}
  if (!l || typeof l !== "object") l = AV.demo ? { ...SAMPLE_LIVE } : { active: {}, command: "idle" };
  l.active = l.active || {}; l.feed = Array.isArray(l.feed) ? l.feed : [];
  const now = Date.now() / 1000;
  for (const [k, ts] of Object.entries(l.active)) if (ts > 1000 && now - ts > 3600) delete l.active[k];
  if (AV.demo && !l.feed.length) Object.assign(l, SAMPLE_LIVE, { active: l.active && Object.keys(l.active).length ? l.active : SAMPLE_LIVE.active });
  live = l;
}
let viewTs = 0;
async function loadView() {                        // the agent's own zoom control
  try {
    const r = await fetch(DATA + "view.json", { cache: "no-store" }); if (!r.ok) return;
    const v = await r.json(); if (!(v.ts > viewTs)) return;
    const first = viewTs === 0; viewTs = v.ts;
    if (first && Date.now() / 1000 - v.ts > 10) return;          // an old command from before this page opened: ignore it
    if (v.view === "team") { setZoom(1); if (v.focus) setTimeout(() => focusOn(v.focus), 900); }
    else if (v.view === "voice") setZoom(0);
  } catch (e) {}
}
const isActive = n => !n ? false : n.kind === "worker" ? !!live.active[n.name] :
  n.kind === "lead" ? (!!live.active[n.name] || nodes.some(w => w.kind === "worker" && w.dept === n.dept && live.active[w.name])) :
  n.kind === "job" ? !!live.active[n.worker.name] : false;
const counts = () => ({ leads: nodes.filter(n => n.kind === "lead").length, workers: nodes.filter(n => n.kind === "worker").length, working: Object.keys(live.active || {}).length });

/* ------------------------------------------------------- sparkline history */
// four slow curves, one point every ten minutes, kept in this browser so a reload does not flatten them
const HIST_KEY = "core.hist.v1", HIST_N = 28, HIST_MS = 600000;
let hist = { t: 0, working: [], turns: [], five: [], seven: [] };
try { const h = JSON.parse(localStorage.getItem(HIST_KEY) || "null"); if (h && h.working) hist = h; } catch (e) {}
function sampleHist(now, vals) {
  if (now - hist.t < HIST_MS) return;
  hist.t = now;
  for (const k of ["working", "turns", "five", "seven"]) { if (vals[k] == null) continue; hist[k].push(vals[k]); if (hist[k].length > HIST_N) hist[k].shift(); }
  try { localStorage.setItem(HIST_KEY, JSON.stringify(hist)); } catch (e) {}
}
const noise = (t) => { const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f), h = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }; return h(i) * (1 - u) + h(i + 1) * u; };
const demoSpark = sd => Array.from({ length: HIST_N }, (_, i) => .25 + .7 * noise(i * .55 + sd * 7));

/* ------------------------------------------------------------- zoom/view */
let zoom = Q.get("view") === "team" ? 1 : 0, zoomT = zoom;          // 0 = the orbits, 1 = the org chart
const view = { x: 0, y: 0, s: 1 }, target = { x: 0, y: 0, s: 1 };
let focusDept = null, hover = null, dragging = null, mouse = null;
function setZoom(z) { zoomT = z; if (!z) { focusOn(null); $("detail").style.display = "none"; } }
function focusOn(dept) {
  focusDept = dept;
  if (!dept) { target.x = 0; target.y = 0; target.s = 1; return; }
  const lead = nodes.find(n => n.kind === "lead" && n.dept === dept); if (!lead) { focusDept = null; return; }
  const mid = (RJ + R2) / 2; target.s = 2; target.x = -Math.cos(lead.th) * mid * chartBase(); target.y = -Math.sin(lead.th) * mid * chartBase();
}
const chartBase = () => Math.min(W - px(792), H - px(180)) / 2 * 0.82 / R3;    // the room between the tiles
const ocx = () => CX, ocy = () => CY - px(30);                                   // the orbits' centre = the chart's centre
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

/* ----------------------------------------------------------------- frame */
const ORBITS = [[.35, .9, P.accent], [-.5, -.7, P.amber], [1.2, .55, P.text]];
const DEMO_USAGE = [{ label: "5H", pct: 34, known: true, hot: false, text: "34%  2h" }, { label: "7D", pct: 61, known: true, hot: false, text: "61%  3d" }];
let clock = 0, t0 = performance.now(), lastZ = -1;
function frame(dt) {
  AV.tick(dt); clock += dt / 1000;
  const st = AV.state, env = AV.env, mic = AV.micLevel || 0, samples = AV.samples;
  const tstate = st !== "idle" ? st : (live.command === "thinking" ? "thinking" : "idle");
  zoom += (zoomT - zoom) * Math.min(1, dt / 420);
  const z = ease(Math.max(0, Math.min(1, zoom)));
  const k = Math.min(1, dt / 220); view.x += (target.x - view.x) * k; view.y += (target.y - view.y) * k; view.s += (target.s - view.s) * k;
  const now = Date.now() / 1000, c = counts();
  const usage = U.usageRows().length ? U.usageRows() : AV.demo ? DEMO_USAGE : [], five = usage.find(u => u.label === "5H"), seven = usage.find(u => u.label === "7D");
  const turns = live.turns != null ? live.turns : (AV.demo ? SAMPLE_LIVE.turns : 0);
  if (!AV.demo) sampleHist(Date.now(), { working: c.working, turns, five: five && five.known ? five.pct : null, seven: seven && seven.known ? seven.pct : null });

  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = P.bg; g.fillRect(0, 0, W, H);
  blob(CX, CY, M * .8, [90, 40, 30], .45);
  for (const s of STARS) dot(s.x, s.y, s.r, [255, 225, 205], s.a * (.8 + .2 * Math.sin(clock * .8 + s.w)), 1.4);

  /* the outer layer: three orbits of particles, the voice */
  const cx = ocx(), cy = ocy(), R0 = M * .3, R = R0 * (1 + 2.4 * z), oa = 1 - .82 * z;
  const spd = tstate === "thinking" ? 2.4 : st === "speaking" ? 1 : st === "listening" ? .7 : .45;
  ORBITS.forEach(([tilt, sp, col], kk) => {
    const cc = st === "listening" ? (kk === 2 ? P.text : P.amber) : col;
    g.save(); g.translate(cx, cy); g.rotate(tilt + Math.sin(clock * .05 + kk) * .05);
    g.strokeStyle = rgba(cc, .35 * oa); g.lineWidth = 1; g.beginPath(); g.ellipse(0, 0, R, R * .38, 0, 0, 6.2832); g.stroke();
    for (let i = 0; i < 40; i++) {
      const a = clock * sp * spd + i * .157 * (kk + 1);
      let s = .15 + .1 * Math.sin(clock * 1.3 + i);
      if (st === "speaking") s = (samples[(i * 3 + kk * 11) % 64] || 0) * env;
