<!DOCTYPE html>
<!--
The Core: a face for ai-visualizer (github.com/jaredrhod/ai-visualizer, AGPL-3.0-or-later),
written for the jarvis-thinkpad build. Same license as the visualizer it plugs into.

Two layers in one sphere:
  outer  a wireframe sphere plus drifting particles = the voice and the personality.
         It turns slowly at idle, whirls and carries pulses while thinking, and its
         vertices push outward with the waveform while speaking.
  core   a dense particle sphere = the agent team, zoomed out. Leads and workers are
         the brighter points; Command is the cluster at the very centre. Agents that
         are working right now glow green even from here.
Zoom in (Z, click the core, or a signal from the agent) and the outer sphere opens
past the edges while the core resolves into the org chart from the Command face.

Data (shared with the Command face, in faces/command/):
  team.json   the roster            (bin/team-sync.py)
  live.json   who works right now   (bin/team-live.py, from hooks)
  view.json   {"view":"team"|"voice","focus":"<dept id>","ts":<epoch>} (bin/core-view.sh)

Keys: Z zoom in/out · Esc back to the voice · F fullscreen · R reload the roster ·
in the team view: wheel zoom, drag pan, click a lead to focus it, double-click to reset.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Core</title>
<style>
  :root{--ink:#dfeeff;--dim:#46688a;--cyan:#39c6ff;--green:#3ddc84;--amber:#ffc46b;
        --mono:"SF Mono",Menlo,Consolas,monospace}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#000;overflow:hidden}
  body{font-family:var(--mono);color:var(--ink)}
  canvas#stage{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  .hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  #brand{position:absolute;top:34px;left:48px}
  #brand .t{font-size:clamp(14px,1.1vw,22px);letter-spacing:.6em;text-shadow:0 0 14px rgba(57,198,255,.55)}
  #brand .s{margin-top:7px;font-size:clamp(8px,.55vw,11px);letter-spacing:.34em;color:var(--dim)}
  #brand .s b{color:var(--cyan);font-weight:normal}
  #state{position:absolute;top:34px;right:48px;text-align:right;font-size:clamp(12px,.9vw,18px);letter-spacing:.5em}
  #state .s{margin-top:7px;font-size:clamp(8px,.55vw,11px);letter-spacing:.3em;color:var(--dim)}
  #teamline{position:absolute;bottom:30px;left:48px;font-size:clamp(8px,.55vw,11px);letter-spacing:.3em;color:var(--dim)}
  #teamline b{color:var(--cyan);font-weight:normal}
  #teamline b.hot{color:var(--green)}
  #hint{position:absolute;bottom:30px;right:48px;font-size:clamp(8px,.55vw,11px);letter-spacing:.3em;color:var(--dim);text-align:right}
  #tip{position:fixed;pointer-events:none;display:none;max-width:300px;padding:8px 10px;z-index:20;
       background:rgba(0,4,12,.92);border:1px solid #123;border-radius:4px;font-size:11px;line-height:1.6;color:#bcd6f0}
  #tip b{color:var(--ink);font-weight:normal;letter-spacing:.15em}
  #tip .k{color:var(--dim)}
  #detail{position:fixed;left:48px;bottom:64px;max-width:420px;display:none;padding:10px 12px;z-index:20;
       background:rgba(0,4,12,.9);border:1px solid #123;border-radius:4px;font-size:11px;line-height:1.7;color:#bcd6f0}
  #detail b{color:var(--cyan);font-weight:normal;letter-spacing:.2em}
  #detail .k{color:var(--dim)}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:5;
       background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.75) 100%)}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<div id="vig"></div>
<div class="hud">
  <div id="brand"><div class="t" id="name">FLINT</div><div class="s">THE CORE · <b id="link">CONNECTED</b></div></div>
  <div id="state"><div id="statemode">IDLE</div><div class="s" id="clock"></div></div>
  <div id="teamline">TEAM <b id="tstat">loading</b></div>
  <div id="hint">Z CORE · F FULLSCREEN</div>
</div>
<div id="tip"></div>
<div id="detail"></div>
<script src="../../core.js"></script>
<script>
"use strict";
const Q = new URLSearchParams(location.search);
AV.init({ mic: true });
const DATA = "../command/";                      // shared with the Command face
const $ = id => document.getElementById(id);
const cv = $("stage"), g = cv.getContext("2d");
const U = AV.util;
const CYAN = [57, 198, 255], BLUE = [64, 140, 255], WHITE = [225, 240, 255], GREEN = [61, 220, 132], AMBER = [255, 196, 107];
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
}
addEventListener("resize", resize); resize();

/* ------------------------------------------------------------ geometry */
function fib(n, jitter = 0) {
  const pts = [], ga = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < n; i++) {
    const y = 1 - (i / (n - 1)) * 2, r = Math.sqrt(1 - y * y), a = ga * i + jitter * Math.sin(i * 12.9898) * 0.6;
    pts.push([Math.cos(a) * r, y, Math.sin(a) * r]);
  }
  return pts;
}
const MESH = fib(72, 0.25);                          // the outer wireframe
const MESH_E = [];                                    // k nearest neighbours, deduped
(function () {
  const seen = new Set();
  MESH.forEach((p, i) => {
    const d = MESH.map((q, j) => [Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]), j]).sort((a, b) => a[0] - b[0]).slice(1, 5);
    for (const [, j] of d) { const k = i < j ? i + ":" + j : j + ":" + i; if (!seen.has(k)) { seen.add(k); MESH_E.push([i, j]); } }
  });
})();
const SCATTER = [];                                   // drifting particles outside the sphere
for (let i = 0; i < 340; i++) {
  const v = fib(340, 1.7)[i], rr = 1.06 + Math.pow(Math.random(), 0.7) * 0.55;
  SCATTER.push({ p: v, r: rr, s: 0.6 + Math.random() * 1.4, bright: Math.random() < 0.12, w: Math.random() * 6.28 });
}
const CORE = fib(460, 0.9).map(p => ({ p, s: 0.7 + Math.random() * 0.9 }));   // the dense core shell
const NUCLEUS = fib(70, 1.3).map(p => ({ p, r: 0.35 + Math.random() * 0.65 })); // command's cluster

/* --------------------------------------------------------------- team */
const R1 = 1, RJ = 1.62, R2 = 2.25, R3 = 3.15;   // the org chart, world units (same as the Command face)
let team = null, live = { active: {}, command: "idle" }, nodes = [], edges = [];
function layout() {
  nodes = []; edges = [];
  const depts = (team.departments || []).filter(d => d && d.name);
  const cmd = { id: "cmd", kind: "cmd", name: team.command || "flint", label: (team.command || "FLINT").toUpperCase(), x: 0, y: 0, r: 0.24, desc: "Command" };
  nodes.push(cmd);
  const n = Math.max(1, depts.length), sector = Math.PI * 2 / n;
  depts.forEach((d, i) => {
    const th = -Math.PI / 2 + i * sector;
    const lead = { id: "lead:" + d.id, kind: "lead", name: d.lead || d.id + "-lead", label: d.name, x: Math.cos(th) * R1, y: Math.sin(th) * R1, r: 0.17, dept: d.id, th, desc: d.folder ? "folder: " + d.folder : "" };
    nodes.push(lead); edges.push({ a: cmd, b: lead, kind: "pillar" });
    const workers = d.workers || [], m = workers.length, spread = sector * 0.78, tools = [];
    workers.forEach((w, j) => {
      const a = th + (m === 1 ? 0 : (j - (m - 1) / 2) * (spread / Math.max(1, m - 1)));
      const wn = { id: "w:" + w.name, kind: "worker", name: w.name, label: w.name, x: Math.cos(a) * R2, y: Math.sin(a) * R2, r: 0.13, dept: d.id, job: w.job || "", tools: w.tools || [], desc: w.description || "" };
      nodes.push(wn);
      if (w.job) {
        const jn = { id: "j:" + w.name, kind: "job", name: w.job, label: w.job, x: Math.cos(a) * RJ, y: Math.sin(a) * RJ, r: 0.075, dept: d.id, worker: wn };
        nodes.push(jn); edges.push({ a: lead, b: jn, kind: "sop" }); edges.push({ a: jn, b: wn, kind: "does" });
      } else edges.push({ a: lead, b: wn, kind: "member" });
      for (const t of wn.tools) { let e = tools.find(x => x.slug === t); if (!e) tools.push(e = { slug: t, users: [] }); e.users.push(wn); }
    });
    const k = tools.length, tspread = sector * 0.86;
    tools.forEach((t, j) => {
      const a = th + (k === 1 ? 0 : (j - (k - 1) / 2) * (tspread / Math.max(1, k - 1)));
      const tn = { id: "t:" + d.id + ":" + t.slug, kind: "tool", name: t.slug, label: t.slug, x: Math.cos(a) * R3, y: Math.sin(a) * R3, r: 0.09, dept: d.id, desc: t.users.length + " user" + (t.users.length === 1 ? "" : "s") };
      nodes.push(tn); for (const u of t.users) edges.push({ a: u, b: tn, kind: "uses" });
    });
  });
  // zoomed-out home for every node: a spot on the core shell (jobs ride with their worker)
  const shell = fib(Math.max(8, nodes.length * 2), 0.4);
  let si = 0;
  for (const nd of nodes) {
    if (nd.kind === "cmd") { nd.p3 = [0, 0, 0]; continue; }
    if (nd.kind === "job") { nd.p3 = null; continue; }
    const p = shell[(si++ * 7) % shell.length];
    nd.p3 = [p[0], p[1], p[2]];
    nd.shell = nd.kind === "lead" ? 0.99 : nd.kind === "worker" ? 0.93 : 0.86;
  }
  for (const nd of nodes) if (nd.kind === "job") nd.p3 = nd.worker.p3, nd.shell = nd.worker.shell;
}
async function loadTeam() {
  try { const r = await fetch(DATA + "team.json", { cache: "no-store" }); if (!r.ok) throw 0; team = await r.json(); layout(); }
  catch (e) { team = null; nodes = []; edges = []; }
  paintStat();
}
async function loadLive() {
  try { const r = await fetch(DATA + "live.json", { cache: "no-store" }); if (r.ok) live = await r.json(); } catch (e) {}
  if (!live || typeof live !== "object") live = { active: {}, command: "idle" };
  live.active = live.active || {};
  const now = Date.now() / 1000;
  for (const [k, ts] of Object.entries(live.active)) if (now - ts > 3600) delete live.active[k];
  paintStat();
}
let viewTs = 0;
async function loadView() {                       // the agent's own zoom control
  try {
    const r = await fetch(DATA + "view.json", { cache: "no-store" }); if (!r.ok) return;
    const v = await r.json();
    if (!(v.ts > viewTs)) return;
    viewTs = v.ts;
    if (v.view === "team") { setZoom(1); if (v.focus) setTimeout(() => focusOn(v.focus), 900); }
    else if (v.view === "voice") setZoom(0);
  } catch (e) {}
}
function paintStat() {
  const el = $("tstat");
  if (!team) { el.textContent = "no roster"; el.className = ""; return; }
  const l = nodes.filter(n => n.kind === "lead").length, w = nodes.filter(n => n.kind === "worker").length, a = Object.keys(live.active).length;
  el.textContent = `${l} leads · ${w} workers` + (a ? ` · ${a} working` : "") + (zoomT ? "  ·  ESC BACK" : "  ·  Z TO ZOOM IN");
  el.className = a ? "hot" : "";
}
const isActive = n => !n ? false : n.kind === "worker" ? !!live.active[n.name] :
  n.kind === "lead" ? (!!live.active[n.name] || nodes.some(w => w.kind === "worker" && w.dept === n.dept && live.active[w.name])) :
  n.kind === "job" ? !!live.active[n.worker.name] : false;

/* ----------------------------------------------------------- zoom/view */
let zoom = 0, zoomT = Q.get("view") === "team" ? 1 : 0;   // 0 = the sphere, 1 = the org chart
const view = { x: 0, y: 0, s: 1 }, target = { x: 0, y: 0, s: 1 };
let focusDept = null, hover = null, dragging = null, mouse = null;
function setZoom(z) { zoomT = z; if (!z) { focusOn(null); $("detail").style.display = "none"; } paintStat(); $("hint").textContent = z ? "ESC BACK · WHEEL ZOOM · CLICK A LEAD" : "Z CORE · F FULLSCREEN"; }
function focusOn(dept) {
  focusDept = dept;
  if (!dept) { target.x = 0; target.y = 0; target.s = 1; return; }
  const lead = nodes.find(n => n.kind === "lead" && n.dept === dept); if (!lead) { focusDept = null; return; }
  const mid = (RJ + R2) / 2; target.s = 2.2; target.x = -Math.cos(lead.th) * mid * chartBase(); target.y = -Math.sin(lead.th) * mid * chartBase();
}
const chartBase = () => Math.min(W, H) / 2 * 0.82 / R3;
const cx = () => W / 2, cy = () => H / 2;
const sx2 = x => cx() + (x * chartBase() + view.x) * view.s, sy2 = y => cy() + (y * chartBase() + view.y) * view.s;

/* ----------------------------------------------------------- 3D helpers */
let rotY = 0, rotX = 0.42, coreRot = 0;
function rot(p, ay, ax) {
  const cy_ = Math.cos(ay), sy_ = Math.sin(ay), cx_ = Math.cos(ax), sx_ = Math.sin(ax);
  const x = p[0] * cy_ + p[2] * sy_, z = -p[0] * sy_ + p[2] * cy_;
  const y = p[1] * cx_ - z * sx_, z2 = p[1] * sx_ + z * cx_;
  return [x, y, z2];
}
function proj(p, R) {                        // perspective: nearer = bigger and brighter
  const f = 1 / (1 - p[2] * 0.28);
  return { x: cx() + p[0] * R * f, y: cy() + p[1] * R * f, f, d: (p[2] + 1) / 2 };
}
const glow = {};
function sprite(col, size) { const k = col.join(",") + "/" + size; return glow[k] || (glow[k] = U.makeGlow(col, size)); }
function dot(x, y, r, col, a) {
  if (r > 1.6) { const s = sprite(col, 32); g.globalAlpha = a; g.drawImage(s, x - r * 2.2, y - r * 2.2, r * 4.4, r * 4.4); g.globalAlpha = 1; }
  g.fillStyle = U.rgba(col, Math.min(1, a * 1.2)); g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
}
function glyph(kind, x, y, r, col) {
  g.strokeStyle = col; g.lineWidth = Math.max(1, r * 0.14);
  if (kind === "job") { g.beginPath(); g.rect(x - r * 0.75, y - r, r * 1.5, r * 2); g.stroke(); g.beginPath(); g.moveTo(x - r * 0.4, y - r * 0.3); g.lineTo(x + r * 0.4, y - r * 0.3); g.moveTo(x - r * 0.4, y + r * 0.1); g.lineTo(x + r * 0.4, y + r * 0.1); g.stroke(); return; }
  g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fillStyle = "rgba(0,3,10,.85)"; g.fill(); g.stroke();
  if (kind === "tool") { g.beginPath(); for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; g.lineTo(x + Math.cos(a) * r * 0.42, y + Math.sin(a) * r * 0.42); } g.closePath(); g.stroke(); }
  else if (kind === "lead") { g.beginPath(); g.arc(x - r * 0.22, y - r * 0.18, r * 0.2, 0, Math.PI * 2); g.stroke(); g.beginPath(); g.arc(x + r * 0.24, y - r * 0.14, r * 0.16, 0, Math.PI * 2); g.stroke(); g.beginPath(); g.arc(x, y + r * 0.42, r * 0.5, Math.PI * 1.1, Math.PI * 1.9); g.stroke(); }
  else { g.beginPath(); g.arc(x, y - r * 0.2, r * 0.24, 0, Math.PI * 2); g.stroke(); g.beginPath(); g.arc(x, y + r * 0.5, r * 0.5, Math.PI * 1.12, Math.PI * 1.88); g.stroke(); }
}

/* ---------------------------------------------------------------- frame */
const pulses = [];                                   // travelling lights on the mesh while thinking
let clock = 0, t0 = performance.now(), lastState = "";
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function frame(dt) {
  AV.tick(dt); clock += dt / 1000;
  const st = AV.state, env = AV.env, mic = AV.micLevel || 0;
  const tstate = st !== "idle" ? st : (live.command === "thinking" ? "thinking" : "idle");
  if (tstate !== lastState) { lastState = tstate; $("statemode").textContent = tstate.toUpperCase(); }
  $("clock").textContent = new Date().toLocaleTimeString([], { hour12: false });
  // zoom eases toward its target; the view (pan/zoom of the chart) eases too
  zoom += (zoomT - zoom) * Math.min(1, dt / 420);
  const z = ease(Math.max(0, Math.min(1, zoom)));
  const k = Math.min(1, dt / 220);
  view.x += (target.x - view.x) * k; view.y += (target.y - view.y) * k; view.s += (target.s - view.s) * k;
  // rotation speed follows the state
  const spin = tstate === "thinking" ? 0.9 : tstate === "speaking" ? 0.28 : tstate === "listening" ? 0.2 : 0.11;
  rotY += dt / 1000 * spin * (1 - z * 0.85); coreRot -= dt / 1000 * (spin * 0.6 + 0.05) * (1 - z);
  rotX = 0.42 + Math.sin(clock * 0.23) * 0.06;

  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  const Ro = Math.min(W, H) * 0.36 * (1 + 2.4 * z);      // outer sphere opens past the edges when zoomed
  const Rc = Math.min(W, H) * 0.36 * 0.37;
  const outerA = 1 - z;                                    // and fades as it goes

  /* scatter particles */
  if (outerA > 0.02) for (const s of SCATTER) {
    const p = rot(s.p, rotY * 0.55 + s.w * 0.02, rotX * 0.6), pr = proj(p, Ro * s.r * (1 + 0.02 * Math.sin(clock * 0.7 + s.w)));
    const a = outerA * (0.25 + 0.75 * pr.d) * (s.bright ? 0.9 : 0.45);
    dot(pr.x, pr.y, (s.bright ? 2.6 : 1.1) * s.s * pr.f, s.bright ? BLUE : CYAN, a);
  }
  /* the outer wireframe: vertices displaced by the voice */
  if (outerA > 0.02) {
    const P = MESH.map((p, i) => {
      let d = 1;
      if (st === "speaking") d += 0.16 * env * (AV.samples[i % 64] || 0) + 0.03 * env;
      if (tstate === "thinking") d += 0.028 * Math.sin(clock * 6 + i * 1.37);
      if (st === "listening") d -= 0.05 * mic * (0.5 + 0.5 * Math.sin(clock * 5 + i));
      return proj(rot([p[0] * d, p[1] * d, p[2] * d], rotY, rotX), Ro);
    });
    const lineCol = st === "listening" ? AMBER : CYAN;
    for (const [i, j] of MESH_E) {
      const a = outerA * (0.12 + 0.42 * Math.min(P[i].d, P[j].d)) * (st === "speaking" ? 0.8 + env * 0.6 : 1);
      g.strokeStyle = U.rgba(lineCol, a); g.lineWidth = 1;
      g.beginPath(); g.moveTo(P[i].x, P[i].y); g.lineTo(P[j].x, P[j].y); g.stroke();
    }
    P.forEach((pr, i) => {
      const bump = st === "speaking" ? env * (AV.samples[i % 64] || 0) : 0;
      dot(pr.x, pr.y, (1.6 + 2.4 * pr.d + bump * 3) * pr.f, pr.d > 0.6 ? WHITE : CYAN, outerA * (0.35 + 0.65 * pr.d));
    });
    // travelling pulses while thinking (and a few at idle)
    const want = tstate === "thinking" ? 16 : tstate === "speaking" ? 6 : 3;
    while (pulses.length < want) pulses.push({ e: MESH_E[Math.random() * MESH_E.length | 0], t: Math.random(), v: 0.4 + Math.random() * 0.9 });
    while (pulses.length > want) pulses.pop();
    for (const pl of pulses) {
      pl.t += dt / 1000 * pl.v; if (pl.t > 1) { pl.t = 0; pl.e = MESH_E[Math.random() * MESH_E.length | 0]; }
      const a = P[pl.e[0]], b = P[pl.e[1]];
      dot(a.x + (b.x - a.x) * pl.t, a.y + (b.y - a.y) * pl.t, 2.2, WHITE, outerA * 0.9);
    }
  }
  /* the core: a dense shell that becomes a faint halo when zoomed in */
  const coreR = Rc * (1 + z * (Ro / Rc * 0.55));
  const coreA = 1 - z * 0.85;
  for (const c of CORE) {
    const pr = proj(rot(c.p, coreRot, rotX * 0.8), coreR);
    dot(pr.x, pr.y, (0.5 + 0.9 * pr.d) * c.s * pr.f, CYAN, coreA * (0.15 + 0.5 * pr.d));
  }
  /* command: the nucleus, glowing with the state */
  const scol = tstate === "listening" ? AMBER : tstate === "thinking" || tstate === "speaking" ? GREEN : WHITE;
  const glowA = st === "speaking" ? 0.5 + env * 0.5 : tstate === "thinking" ? 0.6 + 0.4 * Math.sin(clock * 5) : 0.45;
  const nucR = Rc * 0.3 * (1 + (st === "speaking" ? env * 0.35 : 0)) * (1 - z * 0.6);
  // once the chart is out the nucleus rides on the Command node (which pans with the chart) and fades away
  const ncx = cx() + (sx2(0) - cx()) * z, ncy = cy() + (sy2(0) - cy()) * z, nucA = Math.max(0, 1 - z * 1.15);
  if (nucA > 0.01) for (const q of NUCLEUS) {
    const pr = proj(rot(q.p, -coreRot * 1.6, rotX), nucR * q.r);
    dot(pr.x - cx() + ncx, pr.y - cy() + ncy, (0.9 + 1.4 * pr.d) * pr.f, pr.d > 0.5 ? WHITE : scol, nucA * (0.3 + 0.7 * pr.d) * glowA);
  }
  { const s = sprite(scol, 64); const rr = nucR * 2.4 * glowA; g.globalAlpha = nucA * 0.55 * glowA; g.drawImage(s, ncx - rr, ncy - rr, rr * 2, rr * 2); g.globalAlpha = 1; }
  if (!team) return;

  /* the team: from points on the core shell (z=0) to the org chart (z=1) */
  const deptDim = d => focusDept && d && d !== focusDept ? 0.22 : 1;
  const pulse = 0.55 + 0.45 * Math.sin(clock * 5);
  const pos = new Map();
  for (const n of nodes) {
    let ox, oy, of = 1;
    if (n.kind === "cmd") { ox = cx(); oy = cy(); }
    else { const pr = proj(rot(n.p3, coreRot, rotX * 0.8), coreR * n.shell); ox = pr.x; oy = pr.y; of = pr.f; }
    const tx = sx2(n.x), ty = sy2(n.y);
    pos.set(n, { x: ox + (tx - ox) * z, y: oy + (ty - oy) * z, f: of });
  }
  // chart edges fade in
  if (z > 0.05) for (const e of edges) {
    const A = pos.get(e.a), B = pos.get(e.b), on = isActive(e.a) && (e.b.kind === "tool" || isActive(e.b)) || (e.kind === "pillar" && isActive(e.b));
    const dim = Math.min(deptDim(e.a.dept), deptDim(e.b.dept));
    g.strokeStyle = on ? U.rgba(GREEN, 0.6 * z * dim) : U.rgba(CYAN, 0.22 * z * dim); g.lineWidth = on ? 1.4 : 1;
    g.beginPath(); g.moveTo(A.x, A.y); g.lineTo(B.x, B.y); g.stroke();
    if (on) { const p = (clock * 0.6 + e.a.x * 0.13) % 1; dot(A.x + (B.x - A.x) * p, A.y + (B.y - A.y) * p, 2.2, GREEN, z * dim); }
  }
  g.font = `${Math.max(9, 10.5 * Math.min(1.4, view.s))}px ${getComputedStyle(document.body).fontFamily}`;
  g.textAlign = "center"; g.textBaseline = "top";
  const order = { tool: 0, job: 1, worker: 2, lead: 3, cmd: 4 };
  for (const n of [...nodes].sort((a, b) => order[a.kind] - order[b.kind])) {
    const P = pos.get(n), on = isActive(n), dim = deptDim(n.dept);
    if (n.kind === "job" && z < 0.4) continue;              // jobs only exist in the chart
    if (n.kind === "cmd") {
      if (z < 0.15) continue;                                // the nucleus is command when zoomed out
      const r = Math.max(8, n.r * chartBase() * view.s) * z;
      g.shadowColor = U.rgba(scol, 0.9); g.shadowBlur = 18 * glowA * z;
      if (st === "speaking") for (let i = 1; i <= 3; i++) { g.strokeStyle = U.rgba(scol, 0.35 * env / i * z); g.lineWidth = 1; g.beginPath(); g.arc(P.x, P.y, r * (1 + i * 0.45 * (0.5 + env)), 0, Math.PI * 2); g.stroke(); }
      if (tstate === "thinking") { g.strokeStyle = U.rgba(scol, 0.9 * z); g.lineWidth = 2; g.beginPath(); g.arc(P.x, P.y, r * 1.35, clock * 3, clock * 3 + Math.PI * 0.7); g.stroke(); }

    const col = on ? GREEN : n === hover ? AMBER : n.kind === "lead" ? WHITE : n.kind === "worker" ? CYAN : n.kind === "tool" ? BLUE : [140, 170, 200];
    if (z < 0.6) {
      const a = (1 - z) * (n.kind === "tool" ? 0.5 : 0.9) * (on ? 0.7 + 0.3 * pulse : 1);
      dot(P.x, P.y, outR * (on ? 1.6 : 1) * (1 + z), col, a);
      if (on && z < 0.3) { g.strokeStyle = U.rgba(GREEN, 0.5 * pulse * (1 - z)); g.lineWidth = 1; g.beginPath(); g.arc(P.x, P.y, outR * 3 + pulse * 3, 0, Math.PI * 2); g.stroke(); }
    }
    if (z > 0.4) {
      const a = Math.min(1, (z - 0.4) / 0.4) * dim;
      if (on) { g.shadowColor = U.rgba(GREEN, 0.9); g.shadowBlur = 14 * pulse * a; }
      g.globalAlpha = a; glyph(n.kind, P.x, P.y, zr * z, U.rgba(col, 0.95)); g.globalAlpha = 1; g.shadowBlur = 0;
      const showLabel = z > 0.85 && (n === hover || n.kind === "lead" || (on && n.kind !== "job") ||
        (n.kind === "worker" && (view.s > 1.35 || focusDept === n.dept)) || (n.kind === "tool" && (view.s > 2.2 || focusDept === n.dept)));
      if (showLabel) {
        const outward = n.y < -0.05 ? -1 : 1;

        g.fillStyle = n.kind === "lead" ? U.rgba(WHITE, a) : U.rgba(col, 0.85 * a);

}
function loop() { const now = performance.now(), dt = Math.min(100, now - t0); t0 = now; frame(dt); requestAnimationFrame(loop); }
if (AV.shot) AV.shotRun(frame); else requestAnimationFrame(loop);
AV.ready(a => { $("name").textContent = a.label; });

/* ---------------------------------------------------------- interaction */
function nodeAt(px, py) {
  if (!frame.pos || zoom < 0.9) return null;
  let best = null, bd = 1e9;
  for (const n of nodes) { const P = frame.pos.get(n); if (!P) continue; const rr = Math.max(8, n.r * chartBase() * view.s) + 4, d = Math.hypot(P.x - px, P.y - py); if (d < rr && d < bd) { best = n; bd = d; } }
  return best;
}
const tip = $("tip"), detail = $("detail");
cv.addEventListener("mousemove", e => {
  mouse = { x: e.clientX, y: e.clientY };
  if (dragging) { target.x = view.x = dragging.vx + (mouse.x - dragging.mx) / view.s; target.y = view.y = dragging.vy + (mouse.y - dragging.my) / view.s; return; }
  hover = nodeAt(mouse.x, mouse.y);
  if (hover) {
    const L = [`<b>${hover.label}</b> <span class="k">${hover.kind}</span>`];
    if (hover.job) L.push(`<span class="k">job</span> ${hover.job}`);
    if (hover.tools && hover.tools.length) L.push(`<span class="k">tools</span> ${hover.tools.join(", ")}`);
    if (hover.desc) L.push(hover.desc);
    if (hover.kind === "job") L.push(`<span class="k">worker</span> ${hover.worker.name}`);
    if (hover.kind === "worker" && live.active[hover.name]) L.push(`<span style="color:#3ddc84">working now</span>`);
    tip.innerHTML = L.join("<br>"); tip.style.display = "block";
    tip.style.left = Math.min(mouse.x + 14, W - 310) + "px"; tip.style.top = Math.min(mouse.y + 14, H - 100) + "px";
  } else tip.style.display = "none";
});
cv.addEventListener("mousedown", e => { dragging = { mx: e.clientX, my: e.clientY, vx: view.x, vy: view.y, t: Date.now() }; });
addEventListener("mouseup", e => {
  if (!dragging) return;
  const quick = Date.now() - dragging.t < 300 && Math.hypot(e.clientX - dragging.mx, e.clientY - dragging.my) < 4;
  dragging = null; if (!quick) return;
  if (zoom < 0.1) {                                    // click the core to zoom in
    const Rc = Math.min(W, H) * 0.36 * 0.37;
    if (Math.hypot(e.clientX - cx(), e.clientY - cy()) < Rc * 1.3) setZoom(1);
    return;
  }
  if (zoom < 0.9) return;
  const n = nodeAt(e.clientX, e.clientY);
  if (!n) { detail.style.display = "none"; return; }
  if (n.kind === "lead") focusOn(focusDept === n.dept ? null : n.dept);
  if (n.kind !== "tool" && n.kind !== "cmd") {
    const w = n.kind === "job" ? n.worker : n, rows = [`<b>${w.label}</b> <span class="k">${w.kind}${live.active[w.name] ? " · working now" : ""}</span>`];
    if (w.job) rows.push(`job: ${w.job}`); if (w.tools && w.tools.length) rows.push(`tools: ${w.tools.join(", ")}`); if (w.desc) rows.push(w.desc);
    if (w.kind === "worker") rows.push(`<span class="k">ask: @agent-${w.name} …  ·  memory: .claude/agent-memory/${w.name}/</span>`);
    detail.innerHTML = rows.join("<br>"); detail.style.display = "block";
  }
});
cv.addEventListener("dblclick", () => { if (zoom > 0.9) { focusOn(null); detail.style.display = "none"; } });
cv.addEventListener("wheel", e => {
  if (zoom < 0.9) { if (e.deltaY < 0) setZoom(1); return; }
  e.preventDefault();
  const mx = e.clientX - cx(), my = e.clientY - cy(), f = Math.exp(-e.deltaY * 0.0012), ns = Math.max(0.45, Math.min(6, view.s * f));
  if (ns < 0.5 && e.deltaY > 0 && view.s <= 0.5) { setZoom(0); return; }   // keep zooming out: back to the sphere
  target.x = view.x = mx / ns - (mx / view.s - view.x); target.y = view.y = my / ns - (my / view.s - view.y); target.s = view.s = ns;
}, { passive: false });
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "z" || k === "enter") setZoom(zoomT ? 0 : 1);
  else if (k === "escape") { if (focusDept) { focusOn(null); detail.style.display = "none"; } else setZoom(0); }
  else if (k === "f") { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }

if (zoomT) setZoom(1);
