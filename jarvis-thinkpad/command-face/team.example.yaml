# team.yaml: the roster of Flint's team. Single source of truth.
#   uv run ~/my-agent/bin/team-sync.py            -> faces/command/team.json (the picture)
#   uv run ~/my-agent/bin/team-sync.py --agents   -> creates missing .claude/agents/<dept>/<name>.md
# Rules: worker names are lowercase-with-hyphens and unique; one worker owns one Job;
# a Job is a note at "<department folder>/Jobs/<job>.md" in the vault.
operator: Valentin
command: flint

departments:
  - id: comms
    name: Comms
    lead: comms-lead
    folder: "02 - Business/Comms"
    workers:
      - name: comms-inbox-triage
        job: Triage the inbox
        description: "Sorts mail into reply-today, this-week, FYI and spam, and writes the triage note."
        tools: [gmail, vault]
      - name: comms-reply-drafter
        job: Draft replies
        description: "Drafts replies in Valentin's voice into 00 - Inbox/Drafts."
        tools: [vault]
      - name: comms-crm-pipeline
        job: Keep the pipeline current
        description: "Moves leads between stages and keeps the pipeline note true."
        tools: [vault, sheets]

  - id: finance
    name: Finance
    lead: finance-lead
    folder: "02 - Business/Finance"
    workers:
      - name: finance-ledger
        job: Keep the ledger
        description: "Imports CSV exports and keeps Ledger.md the single source of truth."
        tools: [vault, csv]
      - name: finance-invoices
        job: Chase and file invoices
        description: "Tracks open invoices and drafts reminders."
        tools: [vault, gmail]
      - name: finance-weekly-review
        job: Write the weekly finance review
        description: "One note per week: income, expenses by category, anomalies."
        tools: [vault]

  - id: content
    name: Content
    lead: content-lead
    folder: "02 - Business/Content"
    workers:
      - name: content-writer
        job: Write posts and emails
        description: "Drafts with the jaredrhod-marketing skill loaded."
        tools: [marketing-skill, vault]
      - name: content-scheduler
        job: Keep the content calendar
        description: "Plans and schedules what goes out when."
        tools: [vault, calendar]
      - name: content-lead-magnets
        job: Build lead magnets
        description: "Opt-in offers and the pages behind them."
        tools: [marketing-skill, vault, browser]

  - id: knowledge
    name: Knowledge
    lead: knowledge-lead
    folder: "06 - Resources"
    workers:
      - name: knowledge-librarian
        job: Keep the vault healthy
        description: "Frontmatter, folder indexes, broken links, archive candidates."
        tools: [vault, obsidian]
      - name: knowledge-researcher
        job: Research a question
        description: "Web research with sources and a recommendation."
        tools: [web-search, web-fetch, vault]

  - id: automations
    name: Automations
    lead: automations-lead
    folder: "05 - Home and Machine"
    workers:
      - name: automations-home
        job: Run the house
        description: "Lights, climate, media and Home Assistant automations."
        tools: [home-assistant, vault]
      - name: automations-machine
        job: Keep the ThinkPad healthy
        description: "Disk, updates, Docker, services, backups, the Flint stack."
        tools: [bash, docker, systemd, vault]
      - name: automations-timers
        job: Own the scheduled jobs
        description: "The systemd timers that run the team on their own, and their logs."
        tools: [systemd, vault]
